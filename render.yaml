# Render Blueprint for easygdpslist.
#
# Create it via Render dashboard -> New -> Blueprint -> pick this repository.
# It provisions a PostgreSQL database and the web service (built from the Dockerfile), and wires
# them together.

databases:
  - name: easygdpslist-db
    databaseName: pointercrate
    user: pointercrate
    plan: free # note: Render's free Postgres databases expire after a limited period - upgrade for a real list

services:
  - type: web
    name: easygdpslist
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: easygdpslist-db
          property: connectionString
      # Used by start.sh to create the `.secret` file that signs access tokens.
      # Generated once by Render and kept stable across deploys.
      - key: POINTERCRATE_SECRET
        generateValue: true
      # (ROCKET_ADDRESS=0.0.0.0 and ROCKET_PORT=10000 are set in the Dockerfile.)
      - key: LIST_SIZE
        value: "75"
      - key: EXTENDED_LIST_SIZE
        value: "150"
